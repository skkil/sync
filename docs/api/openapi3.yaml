openapi: 3.0.1
info:
  title: sync
  description: ""
  version: 0.0.1
servers:
- url: ""
tags: []
paths:
  /admin/post-reports:
    get:
      tags:
      - post-report
      summary: Get Post Reports
      description: 관리자 신고 큐를 조회합니다.
      operationId: GetPostReports
      parameters:
      - name: status
        in: query
        description: 신고 상태
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page (Integer)
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: Page Size (Integer)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPostReportsResponse"
              examples:
                GetPostReports:
                  value: "{\"reports\":{\"pageInfo\":{\"page\":1,\"size\":1,\"hasNextPage\"\
                    :true,\"hasPreviousPage\":true},\"content\":[{\"id\":1,\"post\"\
                    :{\"id\":1,\"slug\":\"reported-post\",\"title\":\"신고된 포스트\",\"\
                    content\":\"{\\\"text\\\":\\\"신고된 포스트 내용\\\"}\",\"visibility\"\
                    :\"HIDDEN\"},\"reporter\":{\"handle\":\"john-doe\",\"name\":\"\
                    John Doe\",\"profileImageUrl\":\"https://example.com/john.png\"\
                    ,\"isDeleted\":false},\"reason\":\"SPAM\",\"description\":\"광고\
                    성 게시글입니다.\",\"status\":\"RESOLVED\",\"createdAt\":\"1970-01-01T00:00:00Z\"\
                    ,\"reviewedBy\":{\"handle\":\"john-doe\",\"name\":\"John Doe\"\
                    ,\"profileImageUrl\":\"https://example.com/john.png\",\"isDeleted\"\
                    :false},\"reviewedAt\":\"1970-01-01T00:00:00Z\",\"resolutionNote\"\
                    :\"스팸으로 판단했습니다.\"}]}}"
  /admin/projects:
    get:
      tags:
      - project
      summary: Search Admin Project
      description: 검색어와 가장 일치하는 프로젝트 한 개를 조회합니다. 비공개 프로젝트를 포함하며 관리자용 상세 정보를 제공합니다.
        (관리자 전용)
      operationId: SearchAdminProject
      parameters:
      - name: query
        in: query
        description: "검색어 (프로젝트 이름, 핸들)"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProjectSummary"
              examples:
                SearchAdminProject:
                  value: "{\"id\":1,\"handle\":\"my-project\",\"name\":\"나의 프로젝트\"\
                    ,\"description\":\"프로젝트 설명\",\"website\":\"https://example.com\"\
                    ,\"isPublic\":true,\"joinPolicy\":\"INVITE\",\"followerCount\"\
                    :42,\"teammateCount\":8,\"owner\":{\"handle\":\"john-doe\",\"\
                    name\":\"John Doe\",\"profileImageUrl\":\"https://example.com/john.png\"\
                    ,\"isDeleted\":false},\"createdAt\":\"2025-01-01T00:00:00Z\",\"\
                    iconUrl\":\"https://example.com/icon.png\"}"
  /admin/promotions:
    get:
      tags:
      - promotion
      summary: Get Promotions
      description: 모든 프로모션 목록을 조회합니다. 관리자만 접근할 수 있습니다.
      operationId: GetPromotions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponseList"
              examples:
                GetPromotions:
                  value: "[{\"id\":1,\"active\":true,\"fields\":[{\"key\":\"phoneNumber\"\
                    ,\"type\":\"PHONE_NUMBER\",\"label\":\"전화번호\",\"required\":true}],\"\
                    projectHandle\":\"official-announcements\",\"postSlug\":\"beta-reward-program\"\
                    ,\"postTitle\":\"베타 리워드 프로그램 안내\",\"createdAt\":\"1970-01-01T00:00:00Z\"\
                    }]"
    post:
      tags:
      - promotion
      summary: Create Promotion
      description: 새 프로모션을 생성합니다. 관리자만 접근할 수 있습니다. 생성 직후에는 비활성 상태입니다.
      operationId: CreatePromotion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromotionRequest"
            examples:
              CreatePromotion:
                value: "{\"fields\":[{\"key\":\"phoneNumber\",\"type\":\"PHONE_NUMBER\"\
                  ,\"label\":\"전화번호\",\"required\":true}],\"projectHandle\":\"official-announcements\"\
                  ,\"postSlug\":\"beta-reward-program\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
              examples:
                CreatePromotion:
                  value: |-
                    {
                      "id" : 1,
                      "active" : true,
                      "fields" : [ {
                        "key" : "phoneNumber",
                        "type" : "PHONE_NUMBER",
                        "label" : "전화번호",
                        "required" : true
                      } ],
                      "projectHandle" : "official-announcements",
                      "postSlug" : "beta-reward-program",
                      "postTitle" : "베타 리워드 프로그램 안내",
                      "createdAt" : "1970-01-01T00:00:00Z"
                    }
  /admin/tags:
    get:
      tags:
      - tag
      summary: Get Admin Tags
      description: 모든 전역 태그를 조회합니다. (관리자 전용)
      operationId: GetAdminTags
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTagsResponse"
              examples:
                GetAdminTags:
                  value: "{\"tags\":[{\"id\":1,\"name\":\"java\",\"description\":\"\
                    자바 관련 태그\",\"postCount\":10,\"followerCount\":3,\"projectHandle\"\
                    :null,\"isFollowing\":false,\"verified\":true},{\"id\":2,\"name\"\
                    :\"spring\",\"description\":\"스프링 프레임워크 관련 태그\",\"postCount\"\
                    :5,\"followerCount\":1,\"projectHandle\":null,\"isFollowing\"\
                    :true,\"verified\":false}]}"
    post:
      tags:
      - tag
      summary: Admin Create Tag
      description: 검증된 전역 태그를 생성합니다. (관리자 전용)
      operationId: AdminCreateTag
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
            examples:
              AdminCreateTag:
                value: "{\"name\":\"java\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTagResponse"
              examples:
                AdminCreateTag:
                  value: "{\"id\":1,\"name\":\"java\",\"description\":\"\",\"postCount\"\
                    :0}"
  /admin/users:
    get:
      tags:
      - user
      summary: Search Admin User
      description: 검색어와 가장 일치하는 사용자 한 명을 조회합니다. 관리자용 상세 정보를 포함합니다. (관리자 전용)
      operationId: SearchAdminUser
      parameters:
      - name: query
        in: query
        description: "검색어 (핸들, 이름, 이메일)"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserSummary"
              examples:
                SearchAdminUser:
                  value: "{\"id\":1,\"handle\":\"john-doe\",\"name\":\"John Doe\"\
                    ,\"email\":\"john@example.com\",\"profileImageUrl\":\"https://example.com/john.png\"\
                    ,\"role\":\"USER\",\"isOnboarded\":true,\"isEmailVerified\":true,\"\
                    followerCount\":12,\"followingCount\":7,\"createdAt\":\"2025-01-01T00:00:00Z\"\
                    ,\"deletedAt\":null}"
  /admin/post-reports/{reportId}:
    patch:
      tags:
      - post-report
      summary: Review Post Report
      description: 관리자가 신고를 기각하거나 포스트 숨김으로 처리합니다.
      operationId: ReviewPostReport
      parameters:
      - name: reportId
        in: path
        description: 신고 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewPostReportRequest"
            examples:
              ReviewPostReport:
                value: "{\"resolution\":\"HIDE_POST\",\"resolutionNote\":\"스팸으로 판단\
                  했습니다.\",\"hiddenReason\":\"부적절한 광고성 게시글입니다.\"}"
      responses:
        "204":
          description: "204"
  /admin/projects/{handle}:
    delete:
      tags:
      - project
      summary: Admin Delete Project
      description: 프로젝트를 삭제합니다. 소유자가 아니어도 삭제할 수 있습니다. (관리자 전용)
      operationId: AdminDeleteProject
      parameters:
      - name: handle
        in: path
        description: 삭제할 프로젝트 핸들
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "204"
  /admin/promotions/{id}:
    patch:
      tags:
      - promotion
      summary: Update Promotion
      description: 프로모션의 연결된 게시글과 신청 필드를 수정합니다. 관리자만 접근할 수 있습니다.
      operationId: UpdatePromotion
      parameters:
      - name: id
        in: path
        description: 프로모션 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromotionRequest"
            examples:
              UpdatePromotion:
                value: "{\"fields\":[{\"key\":\"phoneNumber\",\"type\":\"PHONE_NUMBER\"\
                  ,\"label\":\"전화번호\",\"required\":true}],\"projectHandle\":\"official-announcements\"\
                  ,\"postSlug\":\"beta-reward-program\"}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
              examples:
                UpdatePromotion:
                  value: |-
                    {
                      "id" : 1,
                      "active" : true,
                      "fields" : [ {
                        "key" : "phoneNumber",
                        "type" : "PHONE_NUMBER",
                        "label" : "전화번호",
                        "required" : true
                      } ],
                      "projectHandle" : "official-announcements",
                      "postSlug" : "beta-reward-program",
                      "postTitle" : "베타 리워드 프로그램 안내",
                      "createdAt" : "1970-01-01T00:00:00Z"
                    }
  /admin/tags/{name}:
    delete:
      tags:
      - tag
      summary: Admin Delete Tag
      description: 전역 태그를 삭제합니다. (관리자 전용)
      operationId: AdminDeleteTag
      parameters:
      - name: name
        in: path
        description: 태그 이름
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "204"
  /admin/users/{handle}:
    delete:
      tags:
      - user
      summary: Admin Delete User
      description: 사용자를 탈퇴 처리합니다. 관리자 계정과 본인 계정은 삭제할 수 없습니다. (관리자 전용)
      operationId: AdminDeleteUser
      parameters:
      - name: handle
        in: path
        description: 삭제할 사용자 핸들
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "204"
  /admin/promotions/{id}/activate:
    patch:
      tags:
      - promotion
      summary: Activate Promotion
      description: 프로모션을 활성화합니다. 관리자만 접근할 수 있습니다.
      operationId: ActivatePromotion
      parameters:
      - name: id
        in: path
        description: 프로모션 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
              examples:
                ActivatePromotion:
                  value: |-
                    {
                      "id" : 1,
                      "active" : true,
                      "fields" : [ {
                        "key" : "phoneNumber",
                        "type" : "PHONE_NUMBER",
                        "label" : "전화번호",
                        "required" : true
                      } ],
                      "projectHandle" : "official-announcements",
                      "postSlug" : "beta-reward-program",
                      "postTitle" : "베타 리워드 프로그램 안내",
                      "createdAt" : "1970-01-01T00:00:00Z"
                    }
  /admin/promotions/{id}/deactivate:
    patch:
      tags:
      - promotion
      summary: Deactivate Promotion
      description: 프로모션을 비활성화합니다. 관리자만 접근할 수 있습니다.
      operationId: DeactivatePromotion
      parameters:
      - name: id
        in: path
        description: 프로모션 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
              examples:
                DeactivatePromotion:
                  value: |-
                    {
                      "id" : 1,
                      "active" : true,
                      "fields" : [ {
                        "key" : "phoneNumber",
                        "type" : "PHONE_NUMBER",
                        "label" : "전화번호",
                        "required" : true
                      } ],
                      "projectHandle" : "official-announcements",
                      "postSlug" : "beta-reward-program",
                      "postTitle" : "베타 리워드 프로그램 안내",
                      "createdAt" : "1970-01-01T00:00:00Z"
                    }
  /admin/promotions/{id}/signups:
    get:
      tags:
      - promotion
      summary: Get Promotion Signups
      description: 프로모션에 신청한 유저 목록을 조회합니다. 관리자만 접근할 수 있습니다.
      operationId: GetPromotionSignups
      parameters:
      - name: id
        in: path
        description: 프로모션 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPromotionSignupResponseList"
              examples:
                GetPromotionSignups:
                  value: "[{\"id\":1,\"user\":{\"handle\":\"john-doe\",\"name\":\"\
                    John Doe\",\"profileImageUrl\":\"https://example.com/john.png\"\
                    ,\"isDeleted\":false},\"attachment\":{\"phoneNumber\":\"01012345678\"\
                    },\"createdAt\":\"1970-01-01T00:00:00Z\"}]"
  /admin/tags/{name}/unverify:
    patch:
      tags:
      - tag
      summary: Admin Unverify Tag
      description: 전역 태그의 검증 상태를 해제합니다. (관리자 전용)
      operationId: AdminUnverifyTag
      parameters:
      - name: name
        in: path
        description: 태그 이름
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "204"
  /admin/tags/{name}/verify:
    patch:
      tags:
      - tag
      summary: Admin Verify Tag
      description: 전역 태그를 검증 상태로 변경합니다. (관리자 전용)
      operationId: AdminVerifyTag
      parameters:
      - name: name
        in: path
        description: 태그 이름
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "204"
  /admin/users/{handle}/promote:
    patch:
      tags:
      - user
      summary: Promote User To Admin
      description: 주어진 핸들의 사용자를 플랫폼 ADMIN으로 승격합니다.
      operationId: PromoteUserToAdmin
      parameters:
      - name: handle
        in: path
        description: 승격할 사용자 핸들
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "204"
  /auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: Login
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              Login:
                value: "{\"email\":\"user@example.com\",\"password\":\"password123\"\
                  }"
      responses:
        "204":
          description: "204"
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: Logout
      operationId: Logout
      responses:
        "204":
          description: "204"
  /auth/password:
    patch:
      tags:
      - auth
      summary: Change Password
      description: "로그인한 사용자의 비밀번호를 변경합니다. 변경하면 기존 세션이 모두 만료되고 새 세션이 발급되며, 발급된 재설정\
        \ 링크도 무효화됩니다."
      operationId: ChangePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            examples:
              ChangePassword:
                value: "{\"currentPassword\":\"currentPassword\",\"newPassword\":\"\
                  newPassword123\"}"
      responses:
        "204":
          description: "204"
  /auth/register:
    post:
      tags:
      - auth
      summary: Register
      description: Register
      operationId: Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              Register:
                value: "{\"email\":\"newuser@example.com\",\"password\":\"password123\"\
                  ,\"captchaToken\":\"captcha-token\"}"
      responses:
        "204":
          description: "204"
  /auth/email-verification/send:
    post:
      tags:
      - auth
      summary: Send Verification Email
      description: 로그인한 사용자에게 이메일 인증 코드를 발송합니다.
      operationId: SendVerificationEmail
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendVerificationEmailResponse"
              examples:
                SendVerificationEmail:
                  value: "{\"expiresAt\":\"2026-07-16T00:10:00Z\",\"validForSeconds\"\
                    :600}"
  /auth/email-verification/verify:
    post:
      tags:
      - auth
      summary: Verify Email
      description: 발송된 이메일 인증 코드를 확인하여 이메일 인증을 완료합니다.
      operationId: VerifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
            examples:
              VerifyEmail:
                value: "{\"token\":\"ABCDEF\"}"
      responses:
        "204":
          description: "204"
  /auth/password-reset/confirm:
    post:
      tags:
      - auth
      summary: Confirm Password Reset
      description: "재설정 토큰을 사용해 새 비밀번호를 저장합니다. 토큰은 1회만 사용할 수 있으며, 기존 세션은 모두 만료됩니다."
      operationId: ConfirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPasswordResetRequest"
            examples:
              ConfirmPasswordReset:
                value: "{\"token\":\"reset-token\",\"newPassword\":\"newPassword123\"\
                  }"
      responses:
        "204":
          description: "204"
  /auth/password-reset/request:
    post:
      tags:
      - auth
      summary: Request Password Reset
      description: 비밀번호 재설정 링크를 이메일로 발송합니다. 등록되지 않은 이메일이면 404와 함께 USER_NOT_FOUND를
        반환합니다.
      operationId: RequestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
            examples:
              RequestPasswordReset:
                value: "{\"email\":\"user@example.com\"}"
      responses:
        "204":
          description: "204"
  /bookmarks/posts:
    get:
      tags:
      - bookmark
      summary: Get Bookmarked Posts
      description: Get Bookmarked Posts
      operationId: GetBookmarkedPosts
      parameters:
      - name: first
        in: query
        description: Number of items to return from the beginning of the list
        required: false
        schema:
          type: string
      - name: after
        in: query
        description: "Cursor for pagination, indicating the position after which to\
          \ return items"
        required: false
        schema:
          type: string
      - name: last
        in: query
        description: Number of items to return from the end of the list
        required: false
        schema:
          type: string
      - name: before
        in: query
        description: "Cursor for pagination, indicating the position before which\
          \ to return items"
        required: false
        schema:
          type: string
      - name: projectHandle
        in: query
        description: 프로젝트로 검색 범위 제한 (선택)
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedGetPostsResponse"
              examples:
                GetBookmarkedPosts:
                  value: "{\"posts\":{\"pageInfo\":{\"size\":1,\"hasNextPage\":false,\"\
                    hasPreviousPage\":false,\"startCursor\":\"start-cursor\",\"endCursor\"\
                    :\"end-cursor\"},\"nodes\":[{\"cursor\":\"cursor\",\"content\"\
                    :{\"id\":1,\"slug\":\"test-slug\",\"title\":\"Test Post Title\"\
                    ,\"type\":\"SHORT\",\"status\":\"PUBLISHED\",\"scope\":\"WORKSPACE\"\
                    ,\"accessLevel\":\"FULL\",\"author\":{\"handle\":\"john-doe\"\
                    ,\"name\":\"John Doe\",\"profileImageUrl\":\"https://example.com/john.png\"\
                    ,\"isDeleted\":false},\"project\":{\"handle\":\"my-project\",\"\
                    name\":\"나의 프로젝트\",\"description\":\"프로젝트 설명\",\"website\":\"\
                    https://example.com\",\"isPublic\":true,\"joinPolicy\":\"INVITE\"\
