components:
  schemas:
    UploadMediaResponse:
      title: UploadMediaResponse
      required:
      - expiresAt
      - mediaId
      - uploadUrl
      type: object
      properties:
        uploadUrl:
          type: string
          description: Pre-signed Upload URL
        mediaId:
          type: string
          description: Media ID
        expiresAt:
          type: string
          description: Expiration Time
    LoginRequest:
      title: LoginRequest
      required:
      - email
      - password
      type: object
      properties:
        password:
          type: string
          description: Password
        email:
          type: string
          description: Email
    GetProjectResponse:
      title: GetProjectResponse
      required:
      - hasMoreTeammates
      - hasPendingInvitation
      - isFollowing
      - isViewer
      - summary
      - teammates
      type: object
      properties:
        summary:
          required:
          - handle
          - isPublic
          - name
          type: object
          properties:
            website:
              type: string
              description: 프로젝트 웹사이트
              nullable: true
            name:
              type: string
              description: 프로젝트 이름
            isPublic:
              type: boolean
              description: 공개 여부
            description:
              type: string
              description: 프로젝트 설명
              nullable: true
            handle:
              type: string
              description: 프로젝트 핸들
            iconUrl:
              type: string
              description: 프로젝트 아이콘 URL
              nullable: true
          description: 프로젝트 정보
        teammates:
          type: array
          description: 팀원 목록
          items:
            required:
            - role
            - user
            type: object
            properties:
              role:
                type: string
                description: 팀원 역할
                enum:
                - ADMIN
                - MEMBER
              user:
                required:
                - handle
                - name
                type: object
                properties:
                  name:
                    type: string
                    description: 유저 이름
                  handle:
                    type: string
                    description: 유저 핸들
                  profileImageUrl:
                    type: string
                    description: 유저 프로필 이미지 URL
                    nullable: true
                description: 팀원 유저 정보
        isFollowing:
          type: boolean
          description: 현재 사용자의 프로젝트 팔로우 여부
        role:
          type: string
          description: 현재 사용자 역할
          nullable: true
          enum:
          - ADMIN
          - MEMBER
        recentActivities:
          type: array
          description: 최근 활동 목록
          items:
            required:
            - id
            - text
            - timestamp
            type: object
            properties:
              text:
                type: string
                description: 활동 내용
              id:
                type: string
                description: 활동 ID
              timestamp:
                type: string
                description: 활동 시각
        isViewer:
          type: boolean
          description: 현재 사용자의 프로젝트 팀원 여부
        hasPendingInvitation:
          type: boolean
          description: 현재 사용자의 대기 중인 초대 존재 여부
        hasMoreTeammates:
          type: boolean
          description: 추가 팀원 존재 여부
    GetProjectHandleAvailabilityResponse:
      title: GetProjectHandleAvailabilityResponse
      required:
      - available
      type: object
      properties:
        available:
          type: boolean
          description: 핸들 사용 가능 여부
    GetTagResponse:
      title: GetTagResponse
      type: object
      properties:
        tag:
          required:
          - description
          - followerCount
          - id
          - isFollowing
          - name
          - postCount
          type: object
          properties:
            isFollowing:
              type: boolean
              description: 요청자가 해당 태그를 팔로우하고 있는지 여부 (프로젝트 태그는 항상 false)
            name:
              type: string
              description: 태그 이름
            postCount:
              type: number
              description: 태그가 사용된 게시물 수
            description:
              type: string
              description: 태그 설명
            id:
              type: number
              description: 태그 ID
            followerCount:
              type: number
              description: 태그를 팔로우하는 사용자 수
            projectHandle:
              type: string
              description: 프로젝트 태그인 경우 해당 프로젝트의 핸들 (전역 태그인 경우 없음)
              nullable: true
    GetHandleAvailabilityResponse:
      title: GetHandleAvailabilityResponse
      required:
      - available
      type: object
      properties:
        available:
          type: boolean
          description: 핸들 사용 가능 여부
    CreateProjectPostRequest:
      title: CreateProjectPostRequest
      required:
      - content
      - type
      type: object
      properties:
        projectTags:
          type: array
          description: 프로젝트 태그 목록
          nullable: true
          items:
            oneOf:
            - type: object
            - type: boolean
            - type: string
            - type: number
        type:
          type: string
          description: Post Type
          enum:
          - SHORT
          - LONG
          - QUESTION
        title:
          type: string
          description: Title
          nullable: true
        content:
          required:
          - json
          - text
          type: object
          properties:
            json:
              type: string
              description: JSON Content
            mediaIds:
              type: array
              description: 사용된 미디어 ID 목록
              nullable: true
              items:
                oneOf:
                - type: object
                - type: boolean
                - type: string
                - type: number
            text:
              type: string
              description: Text Content
          description: Content
        tags:
          type: array
          description: 전역 태그 목록
          nullable: true
          items:
            oneOf:
            - type: object
            - type: boolean
            - type: string
            - type: number
        status:
          type: string
          description: Post Status
          nullable: true
          enum:
          - DRAFT
          - PUBLISHED
    CreatePostResponse:
      title: CreatePostResponse
      required:
      - slug
      type: object
      properties:
        slug:
          type: string
          description: Post Slug
    UpdateCommentRequest:
      title: UpdateCommentRequest
      required:
      - content
      type: object
      properties:
        content:
          type: string
          description: Comment content
    CreateTagResponse:
      title: CreateTagResponse
      required:
      - description
      - id
      - name
      - postCount
      type: object
      properties:
        name:
          type: string
          description: 태그 이름
        postCount:
          type: number
