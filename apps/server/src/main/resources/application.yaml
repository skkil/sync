spring:
  application:
    name: sync

  config:
    import: optional:file:.env[.properties]

  threads:
    virtual.enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
      cleanup-cron: "0 0 * * * *"

  jackson:
    mapper:
      accept-case-insensitive-enums: true
    time-zone: UTC

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:ID}
            client-secret: ${OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:SECRET}
            # 로컬은 서버(localhost:8080)로 바로 접근하므로 기본 템플릿이 맞다.
            # 프로덕션은 nginx가 /api 프리픽스를 떼어내므로 리다이렉트 URI에
            # /api 를 명시해야 콜백이 다시 서버로 라우팅된다. 환경변수로 오버라이드한다.
            redirect-uri: ${OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID:ID}
            client-secret: ${OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET:SECRET}
            redirect-uri: ${OAUTH2_CLIENT_REGISTRATION_GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - read:user
              - user:email

  ai:
    mcp:
      server:
        enabled: ${MCP_SERVER_ENABLED:true}
        protocol: streamable
        type: sync
        name: sync
        version: 0.0.1
        instructions: >
          SYNC 에 사용자를 대신해 초안을 만든다. 만들어진 글은 자동으로 발행되지
          않으며, 사용자가 직접 검토하고 발행해야 한다.
    vectorstore:
      type: none
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding: ${AI_EMBEDDING_PROVIDER:none}
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL}
          format: json
          temperature: 0
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  cloud:
    aws:
      s3:
        config.enabled: true

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    handle: ${ADMIN_HANDLE:sync-admin}
    name: ${ADMIN_NAME:관리자}
  cors.allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # 앱 앞단에 있는 신뢰 가능한 리버스 프록시 홉 수.
  # X-Forwarded-For 의 뒤에서 이 개수만큼 거슬러 올라간 값을 클라이언트 IP로 본다.
  # 0 이면 헤더를 무시하고 TCP peer 주소를 그대로 쓴다.
  rate-limit:
    trusted-proxy-count: ${APP_RATE_LIMIT_TRUSTED_PROXY_COUNT:1}
  session:
    # idle timeout(위 server.servlet.session.timeout)과 별개로,
    # 활동 여부와 무관하게 세션을 강제 만료시키는 절대 상한.
    absolute-timeout: ${APP_SESSION_ABSOLUTE_TIMEOUT:90d}
  oauth2:
    frontend-redirect-uri: ${APP_OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}

  agent:
    enabled: ${APP_AGENT_ENABLED:true}
    issuer-uri: ${APP_AGENT_ISSUER_URI:http://localhost:8080}
    rsa-private-key: ${APP_AGENT_RSA_PRIVATE_KEY:}
    rsa-public-key: ${APP_AGENT_RSA_PUBLIC_KEY:}
    chatgpt-redirect-uri: ${APP_AGENT_CHATGPT_REDIRECT_URI:}

  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  channel-talk:
    secret-key: ${CHANNEL_TALK_SECRET_KEY:}
  captcha:
    secret-key: ${CAPTCHA_SECRET_KEY:}
  # 초기 출시 범위에서 제외 — 기능 완성 후 활성화 예정.
  websocket:
    enabled: ${WEBSOCKET_ENABLED:false}
  ai:
    enabled: ${AI_FEATURES_ENABLED:true}

management:
  server:
    port: 8081

  observations:
    annotations:
      enabled: true

  logging:
    export:
      otlp:
        enabled: ${ENABLE_TELEMETRY:false}

  tracing:
    export:
      enabled: ${ENABLE_TELEMETRY:false}

  otlp:
    metrics:
      export:
        enabled: ${ENABLE_TELEMETRY:false}

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

server:
  # nginx 등 리버스 프록시가 붙인 X-Forwarded-* 헤더를 신뢰해
  # OAuth2 리다이렉트 URI를 https/공개 도메인 기준으로 생성한다.
  forward-headers-strategy: framework
  servlet:
    session:
      # 활동이 있을 때마다 갱신되는 idle timeout (sliding).
      # 절대 상한은 AbsoluteSessionTimeoutFilter 가 app.session.absolute-timeout 값으로 별도 적용한다.
      timeout: ${APP_SESSION_TIMEOUT:30d}
      cookie:
        path: /
        name: session
        http-only: true
        secure: true
        same-site: lax
        max-age: ${APP_SESSION_TIMEOUT:30d}
